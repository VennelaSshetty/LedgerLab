services:
  postgres:
    image: postgres:17
    container_name: ledgerlab-postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - ledgerlab_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ledgerlab_postgres_data: